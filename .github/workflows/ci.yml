name: ci
on:
  push:
  pull_request:
jobs:
  game:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: game } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: determinism + network tests
        run: npm test
      - name: exploit + fairness suite
        run: for k in bumper laser skyrail; do node tools/accept.mjs $k || exit 1; done
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: install libraries
        run: |
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - run: forge build
      - run: forge test
