# Render Blueprint — https://render.com/docs/blueprint-spec
# Hot Shots on Robinhood Chain TESTNET (46630): online game + real-money (test ETH) matches.
#
# Secrets are generated by Render and never shown to anyone; each service derives its own wallet from
# them. On first boot the game server deploys the escrow contract by itself once its wallet has gas.
# You only set OWNER_ADDRESS (your wallet: receives the 10% house fee, can pause/veto results).
#
# MAINNET is deliberately not configured here: it needs a multisig admin, KMS-held keys, and
# co-signers on independent infrastructure (see README "Going to mainnet").
envVarGroups:
  - name: hot-shots-secrets
    envVars:
      - key: OPERATOR_SECRET       # the server's relayer wallet (pays gas for lobby/settlement txs)
        generateValue: true
      - key: COSIGNER_A_SECRET     # result co-signer A
        generateValue: true
      - key: COSIGNER_B_SECRET     # result co-signer B
        generateValue: true
      - key: COSIGNER_AUTH_TOKEN   # the server's credential when asking co-signers to sign
        generateValue: true

services:
  - type: web
    name: hot-shots-game
    runtime: node
    plan: 0.5c-512mb             # half a CPU; free instances sleep when idle and have too little CPU for 60 Hz matches
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit    # every push to the deploy branch redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "4663"            # Robinhood Chain MAINNET (real ETH). Testnet is 46630.
      - key: ALLOW_RAW_KEYS_ON_MAINNET
        value: i-understand      # lean launch: server-held keys + embedded co-signers (see README "Going to mainnet")
      - key: PRIVY_APP_ID
        value: cmvhen2mi005k0hjwyo66w9rz   # public identifier (safe to commit)
      - key: OWNER_ADDRESS
        sync: false              # set this in the dashboard: your wallet address (0x…)
      - key: EMBEDDED_COSIGNERS
        value: "2"               # 2 co-signer processes beside the server (move to separate hosts to harden)
      - key: DATABASE_URL
        fromDatabase:
          name: hot-shots-db
          property: connectionString
      - fromGroup: hot-shots-secrets

databases:
  - name: hot-shots-db
    plan: free                   # testnet: free Postgres expires after 30 days; switch to a paid plan to keep it
    region: oregon
